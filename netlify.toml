  to = "/administrator.html"
  status = 200

[[redirects]]
  from = "/administrator"
  to = "/administrator.html"
  status = 200

[[redirects]]
  from = "/adminstator"
  to = "/administrator.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/login.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
