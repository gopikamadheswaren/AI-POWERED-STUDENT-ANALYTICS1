  to = "/login.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/student"
  to = "/student.html"
  status = 200

[[redirects]]
  from = "/faculty"
  to = "/faculty.html"
  status = 200

[[redirects]]
